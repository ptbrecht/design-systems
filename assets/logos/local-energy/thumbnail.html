<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Energy — YouTube thumbnail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #D49A45;
  }
  /* Composed preview. The card and the logo stay separate files.
     Do not redraw the wordmark or the star in this file. */
  .card {
    position: absolute;
    inset: 0;
    width: 1280px;
    height: 720px;
    display: block;
  }
  .wordmark {
    position: absolute;
    left: 64px;
    top: 64px;
    height: 56px;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
  <img class="card" src="thumbnail-card.png" alt="">
  <img class="wordmark" src="wordmark.svg" alt="Local Energy">
</body>
</html>
