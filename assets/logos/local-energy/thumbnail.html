<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Energy — YouTube thumbnail</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("../../../fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #D49A45;
  }
  /* Host slot. Replace the silhouette with a cutout of the person on the episode.
     Map luminance 0 to #191919 and 1 to #F2F2F2. Keep the 6px #F2F2F2 stroke.
     Do not draw YouTube's duration badge. Leave x 1024–1280, y 616–720 empty. */
  .wordmark {
    position: absolute;
    left: 64px;
    top: 64px;
    height: 56px;
    width: auto;
    display: block;
  }
  .headline {
    position: absolute;
    left: 64px;
    bottom: 128px;
    font-family: "Archivo Black", sans-serif;
    font-weight: 900;
    font-size: 144px;
    line-height: 1.05;
    letter-spacing: 0;
    color: #191919;
    font-synthesis: none;
  }
  .host {
    position: absolute;
    left: 800px;
    top: 36px;
    width: 416px;
    height: 400px;
    display: block;
  }
</style>
</head>
<body>
  <img class="wordmark" src="wordmark.svg" alt="Local Energy">
  <p class="headline">The line<br>that mattered</p>
  <svg class="host" viewBox="0 0 416 400" aria-hidden="true">
    <defs>
      <clipPath id="host-clip">
        <path id="host-shape" d="M188 28c-36 6-58 36-56 72 1 22 14 38 22 46-28 10-48 40-44 78 4 36 34 54 58 54-6 18-16 34-24 48-78 16-128 58-136 74h392c-6-62-48-108-112-122-8-22-14-46-8-70 8-32 40-52 62-78 18-22 16-58-4-80-22-24-62-32-96-22-6 0-18-8-28-8-10 0-20 4-26 8z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#host-clip)">
      <rect width="416" height="400" fill="#191919"/>
      <path fill="#F2F2F2" d="M168 118c22-8 62-6 84 22 20 26 16 62-6 82-28 24-72 18-96-6-18-18-12-70 18-98z"/>
      <path fill="#F2F2F2" d="M248 268c48-8 110 16 140 72 8 16 12 36 16 60H196c8-28 22-78 52-132z"/>
    </g>
    <use href="#host-shape" fill="none" stroke="#F2F2F2" stroke-width="6" stroke-linejoin="round"/>
  </svg>
</body>
</html>
